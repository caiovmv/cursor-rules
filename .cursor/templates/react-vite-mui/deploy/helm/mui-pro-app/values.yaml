replicaCount: 2

image:
  repository: ghcr.io/example/mui-pro-app
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 4173

ingress:
  enabled: true
  className: nginx
  host: mui-pro-app.local
  path: /

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

env:
  NODE_ENV: production
  APP_ENV: rc
